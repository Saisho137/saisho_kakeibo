name: saisho_kakeibo
description: "Personal finance app: an improved Monefy with Kakeibo pillars."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  archive: 4.7.1
  bloc: 9.2.1
  drift: 2.35.4
  drift_flutter: 0.3.1
  extension_google_sign_in_as_googleapis_auth: 3.0.0
  fl_chart: 1.3.1
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_local_notifications: 23.0.3
  flutter_localizations:
    sdk: flutter
  freezed_annotation: 3.1.0
  get_it: 9.3.0
  go_router: 18.1.4
  google_sign_in: 7.2.0
  googleapis: 19.0.0
  intl: 0.20.3
  material_ui: 1.11.1
  meta: 1.19.0
  package_info_plus: 10.2.2
  path_provider: 2.1.6
  timezone: 0.11.2
  workmanager: 0.10.10
dev_dependencies:
  bloc_test: 10.0.0
  build_runner: 2.17.1
  drift_dev: 2.35.3
  flutter_test:
    sdk: flutter
  freezed: 4.0.3
  mocktail: 1.0.5
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/roboto_flex/RobotoFlex.ttf
    - family: Courgette
      fonts:
        - asset: assets/fonts/courgette/Courgette-Regular.ttf
