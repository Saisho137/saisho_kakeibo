targets:
  $default:
    builders:
      drift_dev:
        options:
          # Dates are stored as ISO-8601 text: readable in backups and free of
          # time zone ambiguity. Changing this later requires a migration.
          store_date_time_values_as_text: true
          databases:
            app_database: lib/core/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
